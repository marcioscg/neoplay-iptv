name: Build APK

# Gera o APK a cada push na main e sob demanda.
# O arquivo fica em Actions > (execução) > Artifacts > neoplay-apk.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK de release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restaurar a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sem segredos de assinatura: o APK sairá assinado com a chave de debug."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/neoplay-release.jks
          cat > android/key.properties <<EOF
          storeFile=neoplay-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Baixar dependências
        run: flutter pub get

      - name: Análise estática
        working-directory: ./app
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings --format machine > analyze.log 2>&1
          status=$?
          while IFS='|' read -r level _ _ file line column length message _; do
            if [ "$level" = "ERROR" ]; then
              echo "::error file=$file,line=$line,col=$column,endColumn=$((column + length))::$message"
            fi
          done < analyze.log
          exit $status

      - name: Publicar relatório do analyzer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-log
          if-no-files-found: ignore
          path: app/analyze.log

      - name: Interromper se a análise falhou
        if: steps.analyze.outcome == 'failure'
        run: exit 1

      - name: Testes
        run: flutter test

      # Celulares, TV boxes e Fire Stick são ARM: deixar o x86 de fora evita
      # falhas de build do SDK do Google Cast e reduz o tamanho do APK.
      - name: Compilar APK universal (release)
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Conferir a assinatura
        run: |
          "$JAVA_HOME/bin/keytool" -printcert -jarfile \
            build/app/outputs/flutter-apk/app-release.apk | head -20

      - name: Limpar segredos do runner
        if: always()
        run: rm -f android/key.properties android/app/neoplay-release.jks

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: neoplay-apk
          if-no-files-found: error
          retention-days: 60
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-*-release.apk
