name: Build APK

# Gera o APK a cada push na main e sob demanda.
# O arquivo fica em Actions > (execução) > Artifacts > neoplay-apk.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK de release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restaurar a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sem segredos de assinatura: o APK sairá assinado com a chave de debug."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/neoplay-release.jks
          cat > android/key.properties <<EOF
          storeFile=neoplay-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Restaurar google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "google-services.json restaurado do secret."
          else
            echo "Secret GOOGLE_SERVICES_JSON_BASE64 ausente: usando placeholder (Firebase fica off no APK)."
            cat > android/app/google-services.json <<'EOF'
          {
            "project_info": { "project_number": "000000000000", "project_id": "placeholder" },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "br.com.neoplay.neoplay" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "placeholder" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Baixar dependências
        run: flutter pub get

      - name: Análise estática
        working-directory: ./app
        continue-on-error: false
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes
        run: flutter test

      # Celulares, TV boxes e Fire Stick são ARM: deixar o x86 de fora evita
      # falhas de build do SDK do Google Cast e reduz o tamanho do APK.
      - name: Compilar APK universal (release)
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm,android-arm64 2>&1 | tee /tmp/build.log

      - name: Diagnóstico do erro de build
        if: failure()
        run: |
          echo "## Falha ao compilar o APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 160 /tmp/build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ERR="$(tail -c 8000 /tmp/build.log 2>/dev/null || echo 'sem log')"
          ERR="${ERR//'%'/'%25'}"
          ERR="${ERR//$'\n'/'%0A'}"
          ERR="${ERR//$'\r'/'%0D'}"
          echo "::error::$ERR"

      - name: Conferir a assinatura
        run: |
          "$JAVA_HOME/bin/keytool" -printcert -jarfile \
            build/app/outputs/flutter-apk/app-release.apk | head -20

      - name: Limpar segredos do runner
        if: always()
        run: rm -f android/key.properties android/app/neoplay-release.jks android/app/google-services.json

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: neoplay-apk
          if-no-files-found: error
          retention-days: 60
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-*-release.apk
