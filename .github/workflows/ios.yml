name: Build iOS

# Gera o app iOS em runner macOS. Roda ao mudar app/ios ou este arquivo, e
# sob demanda em Actions > Build iOS > Run workflow.
#
# Sem os secrets de assinatura: gera "MIAU-NET-unsigned.ipa" (NÃO instala
# direto no iPhone; precisa ser reassinado, ex.: Sideloadly/AltStore com um
# Apple ID). Com os secrets IOS_*: gera .ipa assinado (ad-hoc por padrão).
# Detalhes em docs/BUILD_IOS.md.
on:
  push:
    branches: [main]
    paths:
      - 'app/ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compilar iOS (release)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      SIGNED: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Baixar dependências
        run: flutter pub get

      # Sem o plist o Firebase.initializeApp falha, é capturado no main.dart e
      # o app segue em modo local (mesmo comportamento do APK sem secret).
      - name: Restaurar GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::warning::Secret GOOGLE_SERVICE_INFO_PLIST_BASE64 ausente: app iOS SEM Firebase (modo local)."
            exit 0
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          ruby -e '
            require "xcodeproj"
            p = Xcodeproj::Project.open("ios/Runner.xcodeproj")
            t = p.targets.find { |x| x.name == "Runner" }
            g = p.main_group.find_subpath("Runner")
            unless g.files.any? { |f| f.path == "GoogleService-Info.plist" }
              t.resources_build_phase.add_file_reference(g.new_reference("GoogleService-Info.plist"))
            end
            p.save'
          echo "GoogleService-Info.plist restaurado do secret."

      - name: Compilar sem assinatura
        if: env.SIGNED != 'true'
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qry MIAU-NET-unsigned.ipa Payload)
          echo "::notice::IPA SEM assinatura: não instala direto no iPhone. Veja docs/BUILD_IOS.md."

      - name: Preparar assinatura
        if: env.SIGNED == 'true'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'ad-hoc' }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KPW="$(uuidgen)"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

          PP="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$PP"
          security cms -D -i "$PP" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$PP" "$d/$UUID.mobileprovision"
          done

          IDENTITY="Apple Distribution"
          [ "$IOS_EXPORT_METHOD" = "development" ] && IDENTITY="Apple Development"
          UUID="$UUID" IDENTITY="$IDENTITY" ruby -e '
            require "xcodeproj"
            p = Xcodeproj::Project.open("ios/Runner.xcodeproj")
            t = p.targets.find { |x| x.name == "Runner" }
            t.build_configurations.each do |c|
              s = c.build_settings
              s["CODE_SIGN_STYLE"] = "Manual"
              s["DEVELOPMENT_TEAM"] = ENV["IOS_TEAM_ID"]
              s["PROVISIONING_PROFILE_SPECIFIER"] = ENV["UUID"]
              s["CODE_SIGN_IDENTITY"] = ENV["IDENTITY"]
            end
            p.save'

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$IOS_EXPORT_METHOD</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>br.com.neoplay.neoplay</key><string>$UUID</string>
            </dict>
          </dict></plist>
          EOF

      - name: Compilar IPA assinado
        if: env.SIGNED == 'true'
        run: flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Limpar segredos do runner
        if: always()
        run: |
          rm -f ios/Runner/GoogleService-Info.plist "$RUNNER_TEMP"/cert.p12 "$RUNNER_TEMP"/profile.* "$RUNNER_TEMP"/ExportOptions.plist
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: miaunet-ios
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/ipa/*.ipa
            app/build/ios/ipa/*.ipa
