name: miaunet
description: MIAUNET — Player IPTV com EPG, VOD, Séries e Painel Admin.
publish_to: 'none'
version: 1.0.8+11

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_chrome_cast: ^1.3.1
  http: ^1.2.2
  path_provider: ^2.1.4
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  video_player: ^2.9.2
  crypto: ^3.0.3
  url_launcher: ^6.3.0
  # 1.0.8: senha do "manter conectado" guardada no Keystore em vez de texto puro.
  flutter_secure_storage: ^9.2.2
  # 1.0.8: manter a tela ligada durante a reprodução.
  wakelock_plus: ^1.2.8
  # Backend das contas e da central de uso. Sem trava de versão superior:
  # o pub resolve a versão mais nova compatível com o SDK do CI.
  firebase_core: '>=3.6.0'
  firebase_auth: '>=5.3.0'
  cloud_firestore: '>=5.5.0'

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
