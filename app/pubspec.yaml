name: neoplay
description: Player de listas IPTV (M3U/M3U8 e Xtream Codes) com EPG, VOD e favoritos.
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_chrome_cast: ^1.3.1
  http: ^1.2.2
  path_provider: ^2.1.4
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  video_player: ^2.9.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
